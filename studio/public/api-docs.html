<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marginalia studio API</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
    <style>
      body { margin: 0; }
      .topbar-note { padding: 12px 24px; font: 14px ui-sans-serif, system-ui, sans-serif; background: #18181b; color: #e4e4e7; }

  <body>
    <div class="topbar-note">Contract between the studio server and the React app · <a href="/openapi.yaml">openapi.yaml</a> · <a href="/">Back to the studio</a></div>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
    <script>
      // Read-only: "Try it out" is off, since the write endpoints post to GitLab as you.
      SwaggerUIBundle({ url: '/openapi.yaml', dom_id: '#swagger-ui', supportedSubmitMethods: [], docExpansion: 'list', tryItOutEnabled: false });
    </script>
  </body>
