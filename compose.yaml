# Marginalia in a container. First time:
#   docker compose build
#   docker compose run --rm marginalia claude login     # once; kept in the `claude` volume
#   docker compose run --rm marginalia init             # writes /data/config.json (repos are under /repos)
#   docker compose up -d
# The studio is then at http://localhost:4477. Put your checkouts in ./repos (or set REPOS_DIR).
services:
  marginalia:
    build: .
    image: marginalia:local
    restart: unless-stopped
    ports:
      # Loopback only: the studio has no login.
      - '127.0.0.1:${STUDIO_HOST_PORT:-4477}:4477'
    environment:
      STUDIO_ALLOWED_HOSTS: 'localhost:${STUDIO_HOST_PORT:-4477},127.0.0.1:${STUDIO_HOST_PORT:-4477}'
      ALLOW_POSTING: '${ALLOW_POSTING:-false}'
      ALLOW_PUSH: '${ALLOW_PUSH:-false}'
      MARGINALIA_TEAM_REPO: '${MARGINALIA_TEAM_REPO:-}'
    volumes:
      - data:/data
      - claude:/home/node/.claude
      - ${REPOS_DIR:-./repos}:/repos
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
volumes:
  data:
  claude:
