# Pipeline: tests, studio typecheck + build, and a tag-triggered publish to the GitLab
# npm registry. Jobs are small and independent: add a lint / ts-check job under `test`
# by extending `.node`.
#
# Publishing needs no secret in the repo: CI_JOB_TOKEN authenticates against the
# registry of this project (Settings > Packages and registries must allow it). The
# package scope below must match the scope of "name" in package.json.

stages:
  - test
  - build
  - publish

variables:
  NPM_SCOPE: '@worldia'

.node:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

test:
  extends: .node
  stage: test
  script:
    - npm test
    - npm run check:size

# Modules opt in with `// @ts-check` (tsconfig.json: strict, but not noImplicitAny). New
# modules should start with it; a module that cannot yet pass simply has no header.
typecheck:
  extends: .node
  stage: test
  script:
    - npm run typecheck

studio:test:
  extends: .node
  stage: test
  script:
    - npm --prefix studio ci --cache .npm --prefer-offline
    - npm --prefix studio test

studio:build:
  extends: .node
  stage: build
  script:
    - npm --prefix studio ci --cache .npm --prefer-offline
    - npm run studio:build # tsc --noEmit, then vite build into studio/dist
  artifacts:
    paths:
      - studio/dist
    expire_in: 1 week

# The studio is built by `prepack`, so the tarball ships studio/dist.
publish:
  extends: .node
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - test
    - typecheck
    - studio:test
  script:
    - test "v$(node -p "require('./package.json').version")" = "${CI_COMMIT_TAG%%-*}" || { echo "tag $CI_COMMIT_TAG does not match package.json version"; exit 1; }
    - echo "${NPM_SCOPE}:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
